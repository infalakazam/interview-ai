services:
  - type: web
    name: prepai-interviewiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-ml.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prepai-interviewiq-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: prepai-interviewiq-db
    databaseName: prepai
    user: prepai
    plan: free
    ipAllowList: []
